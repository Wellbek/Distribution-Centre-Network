<script>
const R = JSON.parse(document.getElementById("data").textContent);
const F = R.finals, b = F.baseline, r = F.recommended, sv = R.saving, SITES = R.sites, X = R.extensions, M = R.meta;

}
function nChoose(n, k) { let c = 1; for (let i = 1; i <= k; i++) c = c * (n - k + i) / i; return c; }
const lowCheck = Math.min(...rev.filter(x => x.assumption === "distance model").map(x => x.saving), R.routing_check ? sv.final_mean - R.routing_check.saving_month_shift : Infinity);
const strict = rev.find(x => x.assumption === "vehicle limits"), strictMin = rev.find(x => x.assumption === "vehicle limits and minimum");
const near = sw.filter(s => s.ok98 && s !== best && s.total - best.total < 50e6);
const Q = X && X.sequence, V = X && X.voi, RB = X && X.robustness;
const best5 = R.top5.map(t => R.pool[t.cand].sites), inAll = rec.filter(j => best5.every(s => s.includes(j)));
const L_ = Q ? Q.leases : [], keepAll = L_.find(L => L.in_rec && inAll.some(j => SITES[j].name === L.site)), drop = L_.find(L => !L.in_rec);

// Small map of Korea: stores as dots, DCs as squares
function map(w, h, net, asg, mark) {
  const BB = { lon0: 125.9, lon1: 129.8, lat0: 34.1, lat1: 38.75 }, KX = Math.cos(36.5 * Math.PI / 180), s = Math.min(w / ((BB.lon1 - BB.lon0) * KX), h / (BB.lat1 - BB.lat0));
  const P = (lon, lat) => [((lon - BB.lon0) * KX * s).toFixed(1), ((BB.lat1 - lat) * s).toFixed(1)];

  for (const pr of R.geo.provinces) for (const ring of pr.rings) o += `<path d="${ring.map((p, i) => `${i ? "L" : "M"}${P(p[0], p[1]).join(" ")}`).join("")}Z" fill="#f6f3f8" stroke="#ddd3e2" stroke-width=".6"/>`;

function sweepChart(w, h) {

function seqChart(w, h) {

  const all = lines.flatMap(l => l[1]), lo = Math.min(...all) * 0.98, hi = Math.max(...all) * 1.01, X = m => 60 + m / n * (w - 230), Y = v => h - 24 - (v - lo) / (hi - lo) * (h - 40);

// Project-management order: decision, problem and approach, evidence, assumptions and risks, plan

const H = (sec, title, lead) => `<div class="track">${SECS.map((x, i) => `<span class="${i === sec ? "on" : i < sec ? "done" : ""}">${i + 1} · ${x}</span>`).join("")}</div><h2>${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ""}`;

const steps = Q ? Q.committed.steps : [];
function roadmap(w, h) {

const SL = [
  // 1 · executive summary
  { dark: true, html: `<span class="kick">Executive summary · Dasol logistics network redesign</span>
    <h1>Run <em>${r.k} distribution centres</em>, not eight and not twelve</h1>
    <p class="lead">Keep ${names(kept)}; open ${names(opened)}; give up ${closed.length} sites as their leases expire, from ${L_.length ? L_[0].date.slice(0, 7) : "2027"} to ${L_.length ? L_[L_.length - 1].date.slice(0, 7) : "2029"}. Every store stays served before noon.</p>
    <div class="stats"><div class="stat"><div class="l">Saving per month</div><div class="v">${fM(sv.final_mean)}<small>M KRW</small></div><div class="l">90% ${fM(sv.final_ci[0])}-${fM(sv.final_ci[1])} over demand days; about ${fM(Math.round(lowCheck / 50e6) * 50e6)}-${fM(Math.round(sv.final_mean / 50e6) * 50e6)} across model checks</div></div>
    <div class="stat"><div class="l">On days the search never saw</div><div class="v">${fM(sv.held_mean)}<small>M KRW</small></div><div class="l">${M.days[2]} held-out days</div></div>
    <div class="stat"><div class="l">Needs no lease at all</div><div class="v">${fM(re)}<small>M KRW</small></div><div class="l">redraw the baseline territories</div></div>
    <div class="stat"><div class="l">Deliveries before noon</div><div class="v">100<small>%</small></div><div class="l">baseline and recommended</div></div></div>
    <div class="exec"><div><b>Decision requested</b>three data requests, one business rule, renew ${keepAll ? keepAll.site : "the first lease"}, defer ${drop ? drop.site : "the next renewal"} (last slide)</div><div><b>Main risk</b>Dasol's real network may already be close to a good design: the real-data check comes before any new lease</div><div><b>How to read these slides</b>${DEMOTAG.replace("tag demo", "tag demo inv")} results of the fictional instance · ${REAL.replace("tag real", "tag real inv")} effects that need Dasol's data</div></div>${DEMO("answer", "The answer tab")}` },
  // 2 · the two questions
  { html: `${H(0, "Your two questions: <em>how many DCs, and where?</em>")}
    <div class="cols w"><div>${map(540, 470, rec, null, "change")}<p style="font-size:14px;color:var(--muted);margin:2px 0 0">Purple dots: stores that change DC. Squares: DCs (grey closes; lime dot: new).</p></div>
    <div style="font-size:16px;line-height:1.4"><div class="card" style="padding:11px 16px"><b>How many?</b> ${r.k}. ${near.length ? `${near.map(s => s.k).join(" and ")} DCs are within ${fM(Math.max(...near.map(s => s.total - best.total)) + 1e6)} M a month (near-ties);` : ""} eight costs ${fM(k8.total - r.total)} M a month more; twelve or more cost more in rent than they save on the road. ${DEMOTAG}</div>
    <div class="card" style="margin-top:8px;padding:11px 16px"><b>Where?</b> Keep ${names(kept)}. Open ${names(opened)}. ${inAll.length ? `<br><b>In all five best networks:</b> ${names(inAll)}.` : ""} ${f0(R.stores_view.moved)} stores change DC, all still served before noon. ${DEMOTAG}</div>
    <div class="card" style="margin-top:8px;padding:11px 16px"><b>How sure?</b> ${fM(sv.final_mean)} M a month (90% ${fM(sv.final_ci[0])}-${fM(sv.final_ci[1])}), ${fM(sv.held_mean)} M on unseen days; ${R.routing_check ? `about ${fM(sv.final_mean - R.routing_check.saving_month_shift)} M with a stronger router; ` : ""}for Dasol it rests on the real-data check. ${REAL}</div></div></div>${DEMO("answer", "Map, waterfall and reversals")}` },
  // 3 · the four positions from the review meeting
  { html: `${H(1, "The four positions at the review: <em>four different kinds of claim</em>", "They cannot be ranked against each other until they are written on one scale: total monthly cost.")}
    <table class="reg"><tr><th>Who</th><th>What they said</th><th>Kind of claim</th><th>What we found, on one scale</th></tr>
    <tr><td><b>Strategy & Planning</b></td><td>"From twelve to eight, lease and staff costs fall."</td><td>${pill("decision", "p")} argued from one cost line</td><td>True for rent, incomplete: the best eight-DC network costs ${fM(k8.total)} M a month against ${fM(r.total)} M for ${r.k}.</td></tr>
    <tr><td><b>Delivery Operations</b></td><td>"Wider areas, longer drives, more vehicles."</td><td>${pill("evaluation", "p")} of that decision through daily routing</td><td>Right in kind: eight DCs need ${f0(k8.owned)} owned vehicles, ${r.k} need ${f0(r.owned)}.</td></tr>
    <tr><td><b>Data Team</b></td><td>"Centre of gravity is optimal."</td><td>${pill("method", "p")} for proposing sites</td><td>Optimal for its own criterion (squared straight-line distance), not for cost: its best network costs ${fM(g0.E - R.pool_best)} M a month more, and it cannot choose the number of DCs.</td></tr>
    <tr><td><b>Field Manager</b></td><td>"Close on the map, far by road."</td><td>${pill("model validity", "p")}</td><td>Checked: every distance is a real road distance from OpenStreetMap or calibrated on one.</td></tr></table><p class="src">Source: the four statements recorded at Dasol's review meeting (brief §2.1), quoted as given; no stakeholder view on this slide is invented.</p>
    <div class="key" style="font-size:16.5px">Consequence: Strategy and Delivery Operations are each right about their half of one objective, rent against road cost, and meet on the cost curve (slide 8). A method is judged by what it proposes, priced in full, not by its own score; a claim about validity is checked, not ranked.</div>${DEMO("answer", "The four voices, answer tab")}` },
  // 4 · decision hierarchy and system I/O
  { html: `${H(1, "One decision on top, <em>judged by the operation below it</em>")}
    <div class="flow"><div class="hot"><b>D1 · Network</b>how many DCs, where · once, years</div><div><b>D2 · Territories</b>which DC serves each store · months</div><div><b>D3 · Fleet</b>owned vehicles per DC · contracts</div><div><b>D4 · Routing</b>vehicles and routes · every evening</div></div>
    <p class="lead" style="font-size:17px">Each network is judged by routing its stores on many sampled days and adding rent, vehicles, fuel, spot trucks and relay drivers: the network is <i>evaluated by</i> the operation it creates. The network is fixed long before demand is known; routes are planned each evening once the orders are in.</p>
    <div class="cols"><div class="card"><b>What the system takes in</b><ul><li>Store locations, types and a year of daily orders</li><li>${SITES.length} candidate sites with rents; the 12 baseline DCs and their leases</li><li>Road distances; vehicle rules: 48 cages, 25 stops, 250 km, delivered by 12:00; cost figures</li></ul></div>
    <div class="card"><b>What it gives out</b><ul><li>The number of DCs, their sites and each store's DC</li><li>Owned vehicles per DC</li><li>Monthly cost by component, the saving with its uncertainty, service before noon</li><li>The log of every network evaluated; when the answer would change</li></ul></div></div>${DEMO("how", "How it works, Q1")}` },
  // 5 · methodology in plain words
  { html: `${H(1, "Methodology: <em>three levels, one evaluation</em>")}
    <div class="method"><div class="card"><span class="n">1</span><b>One DC, one morning</b> (lower level)<span class="mname">Step-by-step construction, segment reversal · Lectures 0-1</span><p>Vehicles leave at 04:00 and must reach every store by noon. Each route starts at the farthest store left and takes on stores while load, stops, kilometres and the clock allow, then each route is shortened.</p></div>
    <div class="card"><span class="n">2</span><b>One network, one month</b> (connection)<span class="mname">Transportation LP · Poisson-Gamma, negative-binomial days · own-or-hire quantile · Lectures 1-2</span><p>Stores go to the cheapest suitable open DC (500-1,400 stores each). Assigning stores to fixed DCs is <b>linear</b>, so it is solved exactly for every network. Each DC is routed on ${M.days[0]}-${M.days[1]} sampled demand days, because cost is not linear in demand; vehicles are owned for two days in three.</p></div>
    <div class="card"><span class="n">3</span><b>Which networks to try</b> (upper level)<span class="mname">Bayesian optimisation: GP on E − G2, expected improvement · Lectures 4-5</span><p>Choosing the sites is <b>combinatorial</b>: ${nChoose(SITES.length, r.k).toExponential(1).replace("e+", " × 10^")} ways to pick ${r.k} of ${SITES.length}. A quick estimate proposes ${R.pool.length} candidates for 7-19 DCs; the search spends ${M.budget} full evaluations on the most promising.</p></div></div>
    <div class="flow" style="margin-top:16px"><div><b>Sites</b>a candidate network</div><div><b>Territories</b>linear programme, exact</div><div class="unc"><b>${M.days[0]}-${M.days[1]} demand days</b>uncertainty enters here</div><div class="hot"><b>Routing</b>every DC, every day</div><div><b>Fleet</b>owned for 2 days in 3</div><div><b>Monthly cost</b>rent + vehicles + fuel + spot + relay + failures</div></div>
    <div class="cols3" style="margin-top:12px"><div class="card"><b>Cost of one evaluation</b><p>${r.k} DCs × ${M.days[0]} days = ${r.k * M.days[0]} routing solves; ${M.timing ? `${M.timing.per_eval_s} s on ${M.timing.workers} processes` : ""}. The full run takes about ${Math.round(M.runtime_s / 60)} minutes.</p></div>
    <div class="card"><b>Accuracy, measured</b><p>${R.exact ? `Against an exact solver on small cases: ${R.exact.replace(/extra vehicles mean 0.00 \(max 0\)/, "no extra vehicles")}.` : ""} ${R.routing_check ? `Against a state-of-the-art router: ${R.routing_check.baseline.ours_veh} vs ${R.routing_check.baseline.hgs_veh} vehicles baseline, ${R.routing_check.recommended.ours_veh} vs ${R.routing_check.recommended.hgs_veh} recommended.` : ""}</p></div>
    <div class="card"><b>Search, measured</b><p>The search found the best network on the list after ${R.log_bo.findIndex(x => Math.abs(x.E - R.pool_best) < 1) + 1} of ${M.budget} evaluations; random picking with the same budget did not.</p></div></div>${DEMO("how", "How it works, Q3-Q5")}` },
  // 6 · scope
  { html: `${H(1, "Scope: <em>must, should, could, and won't have this time</em>", "What the model covers, what rests on assumptions, and what it leaves out. The left-out items are not detailed in the brief; we flag them for you to confirm.")}
    <div class="moscow"><div class="card m"><b>Must have</b> <span class="note">in the model</span><ul><li>Every store served every day, every stop before noon</li><li>Vehicle limits: 48 cages, 25 stops, 250 km, the shift</li><li>500-1,400 stores per new DC</li><li>Road distances, not map distances</li><li>Uncertain demand: sampled and held-out days</li><li>Baseline network priced exactly like every redesign</li></ul></div>
    <div class="card s"><b>Should have</b> <span class="note">in, as assumptions to confirm</span><ul><li>A second driver on far routes, priced as an upper bound</li><li>Owned fleet for two days in three, spot trucks above</li><li>Regional rents</li><li>Following the leases as they expire</li></ul></div>
    <div class="card c"><b>Could have</b> <span class="note">next, with real data</span><ul><li>Speeds by time of day (first to add)</li><li>Real dock counts for departure waves</li><li>A stronger router in the evaluation</li><li>Store sales next to orders</li></ul></div>
    <div class="card w"><b>Won't have this time</b> <span class="note">left out, flagged by us</span><ul><li>Several trips per vehicle and day</li><li>Loading-dock congestion</li><li>Returns and empty cages</li><li>The fresh-food second wave</li><li>Jeju and island stores</li><li>One-off moving costs</li></ul></div></div>${DEMO("how", "How it works, Q3 and Q7")}` },
  // 7 · where the cheap criterion misleads
  { html: `${H(2, "Where a quick estimate <em>would have misled you</em>", "The quick estimate prices a network without routing it: rent, plus vehicles from each DC's load (its cages divided by 92% of a 48-cage truck), plus kilometres from a continuous approximation of route length. It takes about 10 ms per network against about 20 core-seconds for a full evaluation, but it ignores the clock: a vehicle from a large territory spends its morning driving out and cannot reach 25 stores by noon.")}
    <div class="cols"><div class="card"><div class="big">${fM(prox.total - r.total)}<small>M KRW a month lost</small></div><p>Trusting the quick estimate alone picks <b>${prox.k} DCs</b>, the number Strategy proposed: it looks cheapest on paper and costs that much more once routed. ${DEMOTAG}</p></div>
    <div class="card"><div class="big">${R.r3.r2_line.toFixed(2)}<small>R², estimate against full cost</small></div><p>Adding the clock to the estimate lifts how much of the full evaluation it explains (R² of a fitted line) from ${R.r3_g1.r2_line.toFixed(2)} to ${R.r3.r2_line.toFixed(2)}, and it then picks ${R.r3.g_pick_k} DCs, the right number. We still evaluate every candidate in full before recommending. ${DEMOTAG}</p></div></div>
    <div class="key">Lesson for the business: a ranking that agrees well on average can still pick the wrong network; judge the decision by the full cost, not the estimate's score.</div>${DEMO("how", "G versus E, How it works Q6")}` },
  // 8 · sweep and recommendation with uncertainty
  { html: `${H(2, `Cost against the number of DCs: <em>${best.k} DCs is the bottom of the curve</em>`)}
    <div class="cols w"><div>${sweepChart(620, 400)}<p style="font-size:14px;color:var(--muted);margin:4px 0 0">Monthly cost, M KRW: dark = DC rent, light = vehicles, fuel, spot trucks, relay drivers (${M.days[0]} sampled days).</p></div>
    <div><div class="card"><b>Saving against the baseline</b> ${DEMOTAG}<div class="big" style="margin-top:6px">${fM(sv.final_mean)}<small>M a month</small></div>90% band ${fM(sv.final_ci[0])}-${fM(sv.final_ci[1])} over ${M.days[1]} demand days; ${fM(sv.held_mean)} M on ${M.days[2]} days the search never saw; about ${fM(Math.round(lowCheck / 50e6) * 50e6)}-${fM(Math.round(sv.final_mean / 50e6) * 50e6)} across the model checks.</div>
    <div class="card" style="margin-top:12px"><b>Where it comes from</b><ul><li>${fM(re)} M: redraw the baseline territories (no lease)</li><li>${fM(sv.waterfall[1].total - sv.waterfall[2].total)} M: better sites for twelve DCs</li><li>${fM(sv.waterfall[2].total - sv.waterfall[3].total)} M: ${r.k} DCs instead of twelve</li></ul></div></div></div>${DEMO("answer", "Sweep and waterfall")}` },
  // 9 · proof
  { html: `${H(2, `Proof: why <em>${r.k} DCs at these sites</em> is the right answer`, `${R.pool.length + (X ? X.generation.evaluated.length : 0)} networks were each priced the same full way; none is cheaper. Then the answer had to pass five tests. ${DEMOTAG}`)}
    <div class="tests">${[
      ["Found by the search, not by luck", `Reached at evaluation ${R.log_bo.findIndex(x => Math.abs(x.E - R.pool_best) < 1) + 1} of ${M.budget}; random picking with the same budget stops, in the median, ${fM(R.random_band.p50[R.random_band.p50.length - 1] - R.pool_best)} M a month worse.`],
      ["Holds on days it never saw", `${fM(sv.held_mean)} M a month on ${M.days[2]} held-out days, against ${fM(sv.final_mean)} M on the final days.`],
      ["Survives a stronger router", R.routing_check ? `With a state-of-the-art router the saving is about ${fM(sv.final_mean - R.routing_check.saving_month_shift)} M a month: smaller, still positive.` : "Router check not run."],
      ["Survives changed assumptions", `${rev.slice(1).filter(x => x.saving > 0).length} of ${rev.length - 1} changes keep it paying; the two that do not are business facts (risk register).`],
      ["Beats every proposal at the review", `Baseline network, Strategy's eight DCs, the quick estimate's pick and the centre of gravity cost ${fM(b.total - r.total)}, ${fM(k8.total - r.total)}, ${fM(prox.total - r.total)} and ${fM(g0.E - R.pool_best)} M a month more.`],
    ].map(([t, d], i) => `<div class="card"><span class="tick">✓</span><b>${i + 1} · ${t}</b><p>${d}</p></div>`).join("")}</div>
    <div style="margin-top:8px">${strip(1240, 100)}</div>
    <p class="lead" style="margin-top:6px;font-size:15px">"Best" means the best of everything evaluated, not a proof: there are ${nChoose(SITES.length, r.k).toExponential(1).replace("e+", " × 10^")} possible sets of ${r.k} sites. A learned generator that sampled sets the search never held found none better.</p>${DEMO("answer", "Why this network, answer tab")}` },
  // 10 · assumption register
  { html: `${H(3, "Assumption register: <em>what you need to confirm</em>")}<p class="lead" style="font-size:15.5px;margin:-4px 0 10px">Generated: ${f0(M.stores_planning)} stores on a real population map, a year of orders, the baseline network as a 2016 design grown since, regional rents. Real: geography and road distances. Elsewhere the brief's figures are used.</p>
    <table class="reg tight xs"><tr><th>Item</th><th>The brief</th><th>We assume</th><th>Why</th><th>Status</th></tr>
    <tr><td><b>Far stores</b></td><td>250 km, 10-hour shift</td><td>A second driver on far routes (500 km, until 19:00, still before noon)</td><td>Otherwise far east-coast and mountain stores get no daily delivery${strict ? `; without it the saving is ${strict.saving < 0 ? "−" : ""}${fM(Math.abs(strict.saving))} M${strictMin ? `, unless a small coastal DC below 500 stores is allowed (${fM(strictMin.saving)} M)` : ""}` : ""}</td><td>${pill("decide now", "r")}</td></tr>
    <tr><td><b>Second driver's price</b></td><td>Not given</td><td>${f0(R.params.relay_day)} KRW a day, a full owned vehicle-day</td><td>Upper bound: truck and fuel are already counted, so a cheaper driver raises the saving</td><td>${pill("confirm", "a")}</td></tr>
    <tr><td>Shift and departure</td><td>10 h incl. loading; leave 04:00-07:00</td><td>Load 03:00, leave 04:00, back with a break by 13:00</td><td>Not timed in the brief; checked with departure waves</td><td>${pill("confirm", "a")}</td></tr>
    <tr><td>Docks per DC</td><td>Not given</td><td>23</td><td>Needed only for the wave check; 29 gives the same answer</td><td>${pill("confirm", "a")}</td></tr>
    <tr><td>Delivery window</td><td>98% before noon</td><td>Every stop before noon</td><td>Conservative; the 2% slack is not used</td><td>${pill("safe side", "g")}</td></tr>
    <tr><td>DC rent</td><td>150 M; dearer near Seoul</td><td>180 / 157.5 / 132 M by region</td><td>No regional figures given; tested at 100 and 200 M</td><td>${pill("measure", "a")}</td></tr>
    <tr><td>Spot trucks</td><td>550,000 KRW a day</td><td>As many as needed</td><td>No supply limit given</td><td>${pill("confirm", "a")}</td></tr>
    <tr><td>Store orders</td><td>Not addressed</td><td>Independent of the delivery time</td><td>No data; a redesign serves some stores later</td><td>${pill("measure", "a")}</td></tr>
    <tr><td>Baseline network</td><td>Placed as a grown chain would be</td><td>A 2016 design with ten years of growth</td><td>No real network given; if it is near-optimal the saving reverses</td><td>${pill("measure first", "r")}</td></tr>
    <tr><td>Scope</td><td>Fresh food optional</td><td>Fresh food, Jeju, moving costs left out</td><td>Allowed by the brief, or not costable without data</td><td>${pill("confirm", "a")}</td></tr></table>${DEMO("data", "Data & baseline tab; full register in the problem definition, Section 3")}` },
  // 11 · inputs required from the business
  { html: `${H(3, "Further inputs required from the business", `What we need, why it matters to the decision, and when. Measuring travel times first is worth ${V ? fM(V.travel.evpi) : "?"} M a month to the decision; more demand history, ${V ? fM(V.rates.evpi) : "?"} M. ${REAL}`)}
    <table class="reg tight"><tr><th>#</th><th>Input</th><th>Why it matters</th><th>Owner</th><th>Due</th><th>Decides</th></tr>
    <tr><td>1</td><td><b>12 months of deliveries, vehicle-days and spot hires</b>, with today's real territories</td><td>Prices today's real network under the same evaluation; the whole saving rests on it (if the baseline is near-optimal: ${opt ? fM(opt.saving) : ""} M)</td><td>Logistics, IT</td><td>Feb 2027</td><td>proceed or stop</td></tr>
    <tr><td>2</td><td><b>Business rule:</b> a second driver on far routes, or a small coastal DC below 500 stores</td><td>Without either no redesign pays (${strict ? fM(strict.saving) : ""} M a month)</td><td>Management</td><td>Mar 2027</td><td>design rule</td></tr>
    <tr><td>3</td><td><b>One month of GPS traces</b> at one DC</td><td>Stop time and speed move the best number of DCs between 9 and 11</td><td>DC operations</td><td>Feb 2027</td><td>9, 10 or 11 DCs</td></tr>
    <tr><td>4</td><td><b>Real rents and lease terms</b>, the 12 baseline sites and the shortlisted sites</td><td>At 100 / 200 M a month the best k is ${rv("DC fixed cost", "100 M") ? rv("DC fixed cost", "100 M").k_star : ""} / ${rv("DC fixed cost", "200 M") ? rv("DC fixed cost", "200 M").k_star : ""}</td><td>Real estate</td><td>Feb 2027</td><td>site list</td></tr>
    <tr><td>5</td><td><b>One-off moving and opening costs</b></td><td>Not in the monthly model; sets the proceed threshold</td><td>Finance</td><td>Apr 2027</td><td>payback</td></tr>
    <tr><td>6</td><td><b>Store sales next to orders</b> (POS)</td><td>Orders are not shelf demand; some stores would be served later</td><td>Store operations</td><td>Apr 2027</td><td>demand model</td></tr>
    <tr><td>7</td><td><b>Spot-truck supply</b> on peak days, <b>dock counts</b> per DC</td><td>The peak day (${R.r2.peak_date}) needs ${f0(R.r2.peak_vehicles - R.r2.owned)} spot trucks above the owned fleet; docks limit departure waves</td><td>Procurement, DC managers</td><td>Apr 2027</td><td>fleet policy</td></tr></table>${DEMO("data", "Data & baseline tab")}` },
  // 12 · risk register
  { html: `${H(3, "Risk register", "Likelihood is our assessment for the real chain; impact is measured in the fictional instance. Each risk has a mitigation in the plan.")}
    <table class="reg tight"><tr><th>Risk</th><th>Likelihood</th><th>Impact, measured</th><th>Mitigation</th><th>Owner</th></tr>
    <tr><td><b>Today's real network is already close to a good design</b></td><td>${pill("medium", "a")}</td><td>${pill("reverses", "r")} keeping it would be ${opt ? fM(-opt.saving) : ""} M a month cheaper</td><td>Real-data check (input 1) before any new lease</td><td>Logistics</td></tr>
    <tr><td><b>Neither a second driver nor a small coastal DC is allowed</b></td><td>${pill("unknown", "a")}</td><td>${pill("reverses", "r")} ${strict ? fM(strict.saving) : ""} M a month</td><td>Decide the business rule now (input 2)</td><td>Management</td></tr>
    <tr><td><b>Stop time or speed differ from 15 min and 35 km/h</b></td><td>${pill("medium", "a")}</td><td>${pill("k 9-11", "a")} saving ${fM(Math.min(rv("stop time", "20 min").saving, rv("speed", "45 km/h").saving))}-${fM(rv("speed", "30 km/h").saving)} M</td><td>GPS study (input 3); 9, 10 and 11 DCs take the same lease steps until 2029</td><td>DC operations</td></tr>
    <tr><td><b>Our router over-states the baseline's cost</b></td><td>${pill("high", "r")}</td><td>${pill("smaller", "a")} about ${R.routing_check ? fM(sv.final_mean - R.routing_check.saving_month_shift) : ""} M instead of ${fM(sv.final_mean)} M</td><td>Re-score with a stronger router before the 2027-12 steps</td><td>Analytics</td></tr>
    <tr><td><b>Rents differ from the assumed tiers</b></td><td>${pill("medium", "a")}</td><td>${pill("k 9-11", "a")} saving ${fM(rv("DC fixed cost", "100 M").saving)}-${fM(rv("DC fixed cost", "200 M").saving)} M</td><td>Real rents (input 4)</td><td>Real estate</td></tr>
    <tr><td><b>Moving and opening costs</b></td><td>${pill("certain", "r")}</td><td>${pill("not costed", "a")} 7 bn pays back within a year</td><td>Finance prices them (input 5); proceed gate</td><td>Finance</td></tr>
    <tr><td><b>Stores served later order differently</b></td><td>${pill("medium", "a")}</td><td>${pill("unknown", "a")} about a quarter of stores served 2 h+ later</td><td>POS check (input 6)</td><td>Store operations</td></tr>
    <tr><td><b>Demand shifts: −15% to +20%, capital region +30%</b></td><td>${pill("medium", "a")}</td><td>${pill("holds", "g")} k stays ${r.k}, saving ≥ ${RB ? fM(Math.min(...RB.filter(x => /volume|region/.test(x.name)).map(x => x.saving))) : ""} M</td><td>None needed; follow at the next expiry</td><td>Planning</td></tr>
    <tr><td><b>Spot trucks short on peak days</b></td><td>${pill("medium", "a")}</td><td>${pill("cost", "a")} more owned vehicles</td><td>Framework contract (input 7)</td><td>Procurement</td></tr></table>${DEMO("answer", "Reversal table; Extensions tab")}` },
  // 12b · operating realities to confirm
  { html: `${H(3, "Operating realities <em>to confirm with the business</em>", "Features of the real operation the brief does not detail. Each is simplified or left out; each could move the cost, and each has a check.")}
    <table class="reg tight xs"><tr><th>Item</th><th>What we assume</th><th>What could happen</th><th>Effect on the answer</th><th>How to check</th></tr>
    <tr><td><b>Traffic jams by time of day</b></td><td>One average speed, 35 km/h</td><td>Rush hour slows returns to capital-region DCs</td><td>At 30 km/h the best k is ${rv("speed", "30 km/h").k_star} and the saving ${fM(rv("speed", "30 km/h").saving)} M</td><td>GPS traces (input 3)</td></tr>
    <tr><td><b>Loading-dock congestion</b></td><td>All vehicles leave at 04:00</td><td>Large DCs cannot load every vehicle at once</td><td>Checked with departure waves: the best k stays ${r.k}</td><td>Real dock counts per DC</td></tr>

    <tr><td><b>Driver hours and breaks</b></td><td>10-hour shift, a 30-minute break</td><td>Labour rules require longer breaks on long days</td><td>Shift-bound routes (${f0(r.census.shift)} of ${f0(r.vehicles_day)} a day) lose stops</td><td>HR and the labour agreement</td></tr>
    <tr><td><b>Drivers for new DCs</b></td><td>Drivers available wherever a DC opens</td><td>Hiring at Wonju, Gyeongju or Naju takes time</td><td>Delays a lease step, not the target</td><td>HR, before each step</td></tr>
    <tr><td><b>Store unloading</b></td><td>15 minutes per stop, any store</td><td>No parking or narrow streets in city centres</td><td>At 20 min the saving is ${fM(rv("stop time", "20 min").saving)} M</td><td>GPS traces; store survey</td></tr>
    <tr><td><b>Several trips per vehicle</b></td><td>One trip per vehicle and day</td><td>Short city routes could do two</td><td>Fewer vehicles, mostly in large territories</td><td>Dispatch practice at one DC</td></tr>
    <tr><td><b>Returns and empty cages</b></td><td>Empty cages ride back, no capacity cost</td><td>Returns take space on the way back</td><td>Small; only on full return legs</td><td>DC managers</td></tr>
    <tr><td><b>Breakdowns and spare vehicles</b></td><td>No breakdowns</td><td>A vehicle fails on a peak day</td><td>Covered by spot hire at 550,000 KRW a day</td><td>Fleet records</td></tr>
    <tr><td><b>Fuel price and staff transfers</b></td><td>350 KRW per km; no transfer cost</td><td>Fuel moves; staff at closing DCs move or leave</td><td>Fuel changes every network alike; transfers add to moving cost</td><td>Finance, HR (input 5)</td></tr></table>${DEMO("how", "How it works, Q3 and Q7")}` },
  // 13 · what would reverse it
  { html: `${H(3, "What would <em>reverse</em> the recommendation", "Each row changes one assumption and re-scores the baseline network against the best network of every size.")}
    <table class="tight"><tr><th>If…</th><th>Best number of DCs</th><th>Saving, M KRW a month</th></tr>${rev.map(x => `<tr class="${x.saving < 0 ? "bad" : x.assumption === "as reported" ? "hl" : ""}"><td>${x.assumption === "as reported" ? "as assumed" : `${x.assumption}: ${x.value}`}</td><td>${x.k_star}</td><td>${x.saving < 0 ? "−" : ""}${fM(Math.abs(x.saving))}</td></tr>`).join("")}</table>
    ${X && X.drift ? `<p style="font-size:14px;margin:8px 0 0">Whatever year the baseline network was last redesigned (${X.drift[0].year}-${X.drift[X.drift.length - 1].year}), the saving stays ${fM(Math.min(...X.drift.map(d => d.saving)))}-${fM(Math.max(...X.drift.map(d => d.saving)))} M a month; only a design on road km for today's stores removes it.</p>` : ""}
    <div class="key" style="font-size:15px;margin-top:8px;padding:8px 14px">Two conditions reverse it: <b>Dasol's real network already close to the best design for today's stores</b> (−${fM(-opt.saving)} M a month)${strict && strict.saving < 0 ? `, and <b>far routes without a second driver while every DC must keep 500 stores</b> (−${fM(-strict.saving)} M; allowing either restores the saving)` : ""}. Both are settled by inputs 1 and 2. ${REAL}</div>${DEMO("answer", "Reversal table")}` },
  // 14 · roadmap
  Q ? { html: `${H(4, "Roadmap: <em>follow the leases</em>, one expiry at a time")}
    <div>${roadmap(1150, 220)}</div><p class="legendp"><span style="color:#751485">● renew</span> <span style="color:#4f6b0c">● close and open a new site</span> <span style="color:#9a9aa2">● close without replacement</span></p>
    <div class="cols3"><div class="card"><b>Follow the leases</b><p>Saves ${((Q.cum_never - Q.committed.cum) / 1e9).toFixed(1)} bn KRW over 36 months; switching at once costs ${((Q.cum_one_shot - Q.cum_never) / 1e9).toFixed(1)} bn <i>more</i> than changing nothing, because released leases must be paid out. ${DEMOTAG}</p></div>
    <div class="card"><b>Redraw territories first</b><p>No lease involved; ${((Q.cum_never - Q.cum_redrawn) / 1e9).toFixed(1)} of those ${((Q.cum_never - Q.committed.cum) / 1e9).toFixed(1)} bn, from the first month after the real-data check. ${DEMOTAG}</p></div>
    <div class="card"><b>Nine, ten or eleven later</b><p>The best 9-, 10- and 11-DC networks take the same step at every expiry; eleven adds one site. Decide after the GPS study. ${REAL}</p></div></div>
    <div style="margin-top:6px">${seqChart(1150, 130)}</div>${DEMO("ext", "Extensions tab")}` } : null,
  // 15 · stage gates
  { html: `${H(4, "Stage gates: <em>measure first, then proceed, revise or stop</em>")}
    <div class="gates"><div class="card"><span class="n">Gate 1 · Apr 2027</span><b>Real-data check</b><p>Score today's real network with 12 months of real deliveries, vehicle-days and spot hires under the same evaluation; compare it with the best redesign. ${REAL}</p></div>
    <div class="card g"><span class="n">Proceed</span><b>Follow the lease sequence</b><p>if today's real network costs more than the best redesign by more than the one-off moving cost (at ${fM(sv.final_mean)} M a month, 7 bn KRW pays back within a year).</p></div>
    <div class="card a"><span class="n">Revise</span><b>Re-run with the measured values</b><p>if stop time or speed lie outside 10-20 min or 30-45 km/h: three commands, about 20 minutes; the number of DCs may become 9 or 11.</p></div>
    <div class="card r"><span class="n">Stop</span><b>Renew leases as they expire</b><p>if the real network comes within the moving cost of the best redesign; keep redrawing territories.</p></div></div>
    <div class="key">Every lease step after June 2027 passes the same gate again with the latest data: the plan commits to the next step only.</div>
    <p style="font-size:16px;font-weight:800;color:var(--purple-ink);margin:16px 0 8px">What to measure first, in order of what it is worth to the decision</p>
    <div class="cols3"><div class="card"><b>1 · Today's real cost</b><p>12 months of outcome tables, re-routed by our model under the same evaluation: decides proceed or stop, the only input that can reverse the answer on its own.</p></div>
    <div class="card"><b>2 · Stop time and speed</b><p>One month of GPS traces at one DC: worth ${V ? fM(V.travel.evpi) : "?"} M a month to the choice between 9, 10 and 11 DCs${V ? `, about ${(V.travel.evpi * 120 / 1e9).toFixed(1)} bn over a ten-year lease` : ""}.</p></div>
    <div class="card"><b>3 · Rents, then demand history</b><p>Real rents move k by one. More demand history is worth ${V ? fM(V.rates.evpi) : "?"} M: the network depends on where stores are, not on each store's exact rate.</p></div></div>${DEMO("checks", "Checks tab")}` },
  // 16 · decision
  { dark: true, html: `<span class="kick">Decision requested</span><h1>Three approvals <em>today</em></h1>
    <div class="stats big3" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="v" style="font-size:24px">Data and one rule</div><div class="l">Inputs 1-4 by end of February 2027: 12 months of deliveries, vehicle-days and spot hires; one month of GPS traces at one DC; real rents. And the rule: a second driver on far routes, or a small coastal DC below 500 stores.</div></div>
    <div class="stat"><div class="v" style="font-size:24px">Renew ${keepAll ? keepAll.site : SITES[inAll[0]].name}</div><div class="l">${keepAll ? `Lease ends ${keepAll.date.slice(0, 7)}. ` : ""}It is in every one of the five best networks, so renewing is right whatever the real data show.</div></div>
    <div class="stat"><div class="v" style="font-size:24px">Defer ${drop ? drop.site : "the next renewal"}</div><div class="l">${drop ? `Lease ends ${drop.date.slice(0, 7)}; ` : ""}the first site the plan gives up. Decide at gate 1 in April 2027. No new site is leased before then.</div></div></div>
    <div class="flow" style="margin-top:22px;position:relative;z-index:1"><div><b>Feb 2027</b>inputs delivered</div><div><b>Mar 2027</b>renew ${keepAll ? keepAll.site.split(" ")[0] : "the first site"}</div><div><b>Apr 2027</b>gate 1: proceed, revise or stop</div><div class="hot"><b>Jun 2027</b>${drop ? drop.site.split(" ")[0] : "next"} lease: first step of the sequence</div></div>
    <p class="lead" style="margin-top:18px;position:relative;z-index:1">Numbers on these slides come from <code>code/</code> (${M.command}, seed ${M.seed}); stores, demand and costs are fictional, geography and roads are real.</p>${DEMO("answer", "Open the demonstration")}` },
].filter(Boolean);

const stage = document.getElementById("stage");
SL.forEach((s, i) => { const d = document.createElement("section"); d.className = "slide" + (s.dark ? " dark" : ""); d.innerHTML = s.html + `<div class="foot">${i + 1} / ${SL.length}</div>`; stage.appendChild(d); const dot = document.createElement("i"); dot.title = `slide ${i + 1}`; dot.onclick = () => go(i); document.getElementById("dots").appendChild(dot); });
let cur = 0;
function go(i) {
  cur = Math.max(0, Math.min(SL.length - 1, i));
  document.querySelectorAll(".slide").forEach((s, k) => { s.classList.toggle("on", k === cur); s.classList.toggle("prev", k < cur); });
  document.querySelectorAll("#dots i").forEach((d, k) => d.classList.toggle("on", k === cur));
  document.getElementById("count").textContent = `${cur + 1} / ${SL.length}`;
  history.replaceState(null, "", "#" + (cur + 1));
}
function fit() { const s = Math.min(innerWidth / 1300, (innerHeight - 50) / 740); stage.style.transform = `scale(${s}) translate(-50%, -52%)`; }
document.getElementById("prev").onclick = () => go(cur - 1); document.getElementById("next").onclick = () => go(cur + 1);
addEventListener("keydown", e => { if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur + 1); } if (["ArrowLeft", "PageUp"].includes(e.key)) go(cur - 1); });
addEventListener("resize", fit); fit(); go((+location.hash.slice(1) || 1) - 1);
</script>
